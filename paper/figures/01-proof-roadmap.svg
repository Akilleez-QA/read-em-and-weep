<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1310" viewBox="0 0 1800 1310"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#53686D" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#F5F3EE"/><text x="70" y="59" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">PROOF PROGRESS  /  01</text><text x="70" y="119" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700">What is proved. What still stands in the way.</text><text x="70" y="163" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400">Logical milestones, not area-scaled work estimates. Each lane retains its own mathematical scope.</text><rect x="70" y="194" width="1660" height="68" rx="18" fill="#172E35" stroke="none" stroke-width="2"/><text x="95" y="239" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">ORIGINAL PROOF REPAIR REMAINS OPEN</text><text x="70" y="312" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">01</text><text x="115" y="312" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700">Structural reductions</text><text x="70" y="350" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Full space of quadrics</text><rect x="70" y="375" width="530" height="327" rx="18" fill="#E3F0E9" stroke="none" stroke-width="2"/><text x="94" y="414" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">CHECKED</text><text x="635" y="312" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">02</text><text x="680" y="312" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700">Adjoint section gate</text><text x="635" y="350" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Inversion-even family</text><rect x="635" y="375" width="530" height="327" rx="18" fill="#E3F0E9" stroke="none" stroke-width="2"/><text x="659" y="414" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">CHECKED</text><text x="1200" y="312" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">03</text><text x="1245" y="312" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700">Actual lifting machinery</text><text x="1200" y="350" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Fixed actual bundle and markings</text><rect x="1200" y="375" width="530" height="327" rx="18" fill="#E3F0E9" stroke="none" stroke-width="2"/><text x="1224" y="414" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">CHECKED</text><text x="94" y="462" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">Primary injectivity</text><text x="94" y="502" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">+ square Rao injectivity</text><text x="94" y="558" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Residual surjectivity follows.</text><text x="94" y="594" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Both good flanks share a</text><text x="94" y="630" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">dense smooth open.</text><text x="94" y="669" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Reduces the problem; does not solve it.</text><text x="659" y="462" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">Odd sector vanishes.</text><text x="659" y="502" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">Positive sector: 4 or 5 sections.</text><text x="659" y="558" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Actual third obstruction = 0.</text><text x="659" y="594" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">This rules out a third-order finish,</text><text x="659" y="630" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">not the remaining obstruction.</text><text x="659" y="669" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">The next possible order is fourth.</text><text x="1224" y="460" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Complete Cartan–Koszul</text><text x="1224" y="496" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">multiplier determined.</text><text x="1224" y="549" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Canonical square-zero lift of aN</text><text x="1224" y="585" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">on the actual 2Q constructed.</text><text x="1224" y="621" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Fixed endpoint scale determined.</text><text x="1224" y="669" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Not a lift of N or an extension to 3Q.</text><path d="M335.0,712 L335.0,746" stroke="#53686D" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="760" width="530" height="214" rx="18" fill="#FFF0D9" stroke="none" stroke-width="2"/><text x="94" y="800" fill="#9A581C" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">OPEN FRONTIER</text><path d="M900.0,712 L900.0,746" stroke="#53686D" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="635" y="760" width="530" height="214" rx="18" fill="#FFF0D9" stroke="none" stroke-width="2"/><text x="659" y="800" fill="#9A581C" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">OPEN FRONTIER</text><path d="M1465.0,712 L1465.0,746" stroke="#53686D" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1200" y="760" width="530" height="214" rx="18" fill="#FFF0D9" stroke="none" stroke-width="2"/><text x="1224" y="800" fill="#9A581C" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">OPEN FRONTIER</text><text x="94" y="847" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Actual 20 → 20 extension boundary</text><text x="94" y="885" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">still has to be resolved.</text><text x="94" y="923" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Good flanks alone are insufficient.</text><text x="659" y="847" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Fourth / next division and quotient.</text><text x="659" y="885" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Actual fourth value unevaluated.</text><text x="659" y="923" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Four-versus-five remains undecided.</text><text x="1224" y="847" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Further division qvₕ = ahζₐ.</text><text x="1224" y="885" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Higher-weight comparison and</text><text x="1224" y="923" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">higher-neighborhood extension.</text><rect x="70" y="1000" width="1660" height="160" rx="18" fill="#FFFFFF" stroke="#CDD5D2" stroke-width="2"/><text x="96" y="1039" fill="#9A581C" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">BRIDGES STILL NEEDED FOR THE ORIGINAL GOAL</text><text x="96" y="1085" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Prescribed-source recovery / boundary</text><text x="770" y="1085" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Higher lifting</text><text x="1220" y="1085" fill="#172E35" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Weil-class algebraicity</text><path d="M690,1078 L738,1078" stroke="#53686D" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1115,1078 L1180,1078" stroke="#53686D" stroke-width="2.5" marker-end="url(#arrow)"/><text x="96" y="1131" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Even settling the four-section alternative closes only the adjoint gate, not these remaining bridges.</text><text x="70" y="1204" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Evidence cutoff: 22 October 2026, 08:30 UTC. Published, independently audited results only.</text><text x="70" y="1245" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">CHECKED = written proof + independent audit / symbolic checks, not Lean certification.</text><text x="70" y="1280" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Counts describe branches or necessary records, not probability or percentage completion.</text><text x="1660" y="1280" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">01 / 02</text></svg>