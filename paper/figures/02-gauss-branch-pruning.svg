"2"/><rect x="562.8571428571429" y="1335" width="328.57142857142856" height="36" rx="0" fill="#53A48D" stroke="none" stroke-width="2"/><text x="530" y="1411" fill="#176757" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">11 removed (31.43%)</text><text x="1180" y="1411" fill="#9A581C" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">24 still open / retained</text><text x="95" y="1460" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">Dark green: earlier exclusions. Light green: newest exclusions. Amber: retained.</text><text x="70" y="1530" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">These scales count candidates, not equal difficulty, likelihood, or overall proof completion.</text><text x="70" y="1570" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Geometric families are handled by family-wide proofs, not enumeration.</text><text x="70" y="1635" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">CHECKED = written proof + independent audit / symbolic checks, not Lean certification.</text><text x="70" y="1670" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">Counts describe branches or necessary records, not probability or percentage completion.</text><text x="1660" y="1670" fill="#53686D" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400">02 / 02</text></svg>